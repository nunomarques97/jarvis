# Exemplo VERSIONADO de config.toml. Copia este ficheiro para
# "config.toml" na raiz do repositorio e substitui os valores pelos teus:
# nome do microfone tal como aparece no Windows, e um projeto por bloco
# [[projetos]] com o caminho real no teu disco.
#
# config.toml fica de fora do Git (esta no .gitignore). Nunca metas o teu
# disco pessoal nem nomes de projetos reais neste ficheiro de exemplo: so os
# dados ficticios abaixo (caminhos do tipo "D:/caminho/para/projeto").

[microfone]
nome = "Microfone USB Generico"

[[projetos]]
nome = "exemplo-um"
caminho = "D:/caminho/para/projeto-um"

[[projetos]]
nome = "exemplo-dois"
caminho = "D:/caminho/para/projeto-dois"

# Opcional: como o jarvis ouve. Sem esta tabela valem estes mesmos valores.
# tecla: a tecla de falar (segurar para falar, soltar para acabar); uma de
#   ctrl-direito, alt-direito, shift-direito, scroll-lock, f13 ... f24
#   (so teclas sem acao propria: o jarvis le a tecla mas nao a bloqueia).
# motor: parakeet-tdt-0.6b-v3, whisper-medium ou whisper-large-v3-turbo.
# device: cpu ou cuda. lingua: pt ou en (tambem escolhe a palavra de ativacao:
#   "hey jarvis" em en, "boas jarvis" em pt).
# limiar_ativacao: score minimo da palavra de ativacao (0 a 1). O valor certo
#   para a tua voz e o teu ruido sai de scripts/avaliar_ativacao.py, que o
#   escreve na evidencia; ate la vale 0.6.
# fim_de_turno: como o jarvis decide que acabaste de falar. "silencio" espera
#   0.6 s de silencio; "smart-turn" pergunta ao modelo Smart Turn (em
#   models/smart-turn/, ver docs/MODELOS.md) depois de 0.2 s: frase acabada
#   fecha aos 0.3 s, frase a meio espera ate fim_de_turno_maximo_s (0.6 a 5).
#   Sem o ficheiro do modelo fica o "silencio". scripts/avaliar_fim_de_turno.py
#   compara os dois nas tuas gravacoes.
[ouvido]
tecla = "ctrl-direito"
motor = "parakeet-tdt-0.6b-v3"
device = "cpu"
lingua = "pt"
limiar_ativacao = 0.6
fim_de_turno = "silencio"
fim_de_turno_maximo_s = 1.5

# Opcional: o interprete, o LLM local que percebe a intencao, o projeto e
# reescreve o ditado num prompt claro antes da confirmacao. Com o cerebro
# ligado so e usado como recurso (sem internet ou sem quota) e nao e aquecido
# no arranque: carrega na primeira frase que precisar dele. Sem esta tabela
# valem estes mesmos valores.
# url: o Ollama deste computador (so http em 127.0.0.1, localhost ou ::1; o
#   texto nunca sai do PC antes de o confirmares).
# modelo / modelo_alternativo: o alternativo entra quando o principal nao esta
#   instalado ou nao cabe na VRAM livre. Instalar com "ollama pull <modelo>".
# limite_s: espera maxima pelo LLM (no maximo 5); acima disso a frase fica
#   "desconhecido" e o texto literal so segue para confirmacao.
# carregamento_s: quando nenhum dos modelos esta carregado (outro programa
#   usou o Ollama e despejou-o), o jarvis diz "um momento" e espera ate este
#   tempo pelo carregamento (entre o limite_s e 60).
# confirmacao_s: quanto tempo o jarvis espera pelo "sim" depois de dizer o que
#   percebeu (entre 3 e 120; conta a partir do fim da fala do recap); sem
#   resposta, o pedido e cancelado sem envio.
[interprete]
url = "http://127.0.0.1:11434"
modelo = "qwen3:8b"
modelo_alternativo = "qwen3:4b"
limite_s = 5.0
carregamento_s = 20.0
confirmacao_s = 30.0
# Um ditado sem projeto dito, ate estes minutos depois do ultimo pedido num
# projeto, assume esse projeto (o recap diz qual e so vai com "sim"); 0 desliga.
ultimo_projeto_min = 10.0

# Opcional: runs FORJA por voz ("como esta o run do X", "le o relatorio",
# lancar, retomar e parar). Sem esta tabela o jarvis so ve as sessoes do
# Claude Code. Descomenta e preenche com os teus caminhos reais.
# caminho: a pasta da instalacao da FORJA (a que tem bin/forja.mjs).
# perfil: o ficheiro JSON passado em --config a cada run lancado por voz.
# provider: claude ou codex.
# [forja]
# caminho = "D:/caminho/para/forja"
# perfil = "D:/caminho/para/perfil-forja.json"
# provider = "claude"

# Opcional: onde estas, para as perguntas gerais e de atualidade ("que tempo
# faz hoje", "quem ganhou o jogo") que o cerebro responde com pesquisa na web.
# Sem esta tabela vale este mesmo valor.
# localizacao: onde estas, para o tempo, os jogos e as noticias de hoje quando
#   a pergunta nao diz (uma linha curta, por exemplo "Porto, Portugal").
# As chaves antigas modelo e limite_s continuam aceites, mas ja nao fazem
# nada: o modelo e a espera sao os de [cerebro].
[perguntas]
localizacao = "Portugal"

# Opcional: o cerebro de conversa, um processo claude persistente que conversa
# contigo do principio ao fim (so pode pesquisar e ler paginas da web; nunca
# le ficheiros dos projetos nem corre comandos). Gasta quota da tua
# subscricao Claude em cada frase, sem chave de API. A conversa fica so em
# memoria, nunca em disco. Sem esta tabela valem estes mesmos valores.
# ativo: false desliga a conversa pelo cerebro.
# modelo: modelo do Claude Code do cerebro (um rapido chega; "sonnet" tambem serve).
# contexto_max_tokens: tamanho da conversa, em tokens, a partir do qual a
#   seguinte recomeca numa sessao nova com um resumo curto e os teus factos
#   (entre 4000 e 24000).
# inativo_min: minutos sem conversa ate recomecar da mesma forma (1 a 240).
# limite_s: espera maxima por uma resposta (entre 10 e 300); acima disso o
#   jarvis diz que nao conseguiu.
# reintentar_s: se o cerebro nao estiver disponivel (sem internet, sem quota,
#   sessao por iniciar, ou duas falhas seguidas), o jarvis usa o interprete
#   local durante estes segundos e depois tenta o cerebro outra vez (10 a 3600).
# espera_dos_avisos_s: os avisos dos projetos (uma sessao acabou, um run
#   terminou, uma resposta chegou) nunca sao ditos no meio da conversa; o
#   cerebro fica a saber deles, e os que sobram sao ditos juntos numa frase
#   curta depois de este tempo sem conversa (5 a 300).
[cerebro]
ativo = true
modelo = "claude-haiku-4-5"
contexto_max_tokens = 16000
inativo_min = 30
limite_s = 60
reintentar_s = 120
espera_dos_avisos_s = 20

# Opcional: a voz das respostas em ingles (lingua = "en"). Sem esta tabela vale
# "bm_fable", uma voz masculina britanica do Kokoro-82M. Uma de af_heart
# (americana), bm_george, bm_lewis, bm_daniel ou bm_fable (britanicas). Para
# as ouvir antes de escolher: .venv\Scripts\python scripts/amostras_voz.py
# (grava um WAV por voz em audio/amostras-voz/; com --com-som toca-os).
# velocidade (opcional, 0.8 a 1.3) muda o ritmo da fala; sem ela cada voz fala
# a sua velocidade. Para comparar: scripts/amostras_voz.py --velocidades 1.0 1.15 1.3
# frases_geradas = false deixa so as frases fixas (sem o LLM local a escrever
# as respostas sociais curtas e o "nao percebi").
[voz]
nome = "bm_fable"
# velocidade = 1.15
# frases_geradas = true

# Opcional: adaptacao da transcricao ao teu sotaque, so quando lingua = "en" e
# o motor e o Parakeet. Sem esta tabela fica tudo desligado (como antes).
# reforco: da preferencia, durante a transcricao, as frases de comando do
#   jarvis ("Claude", "abort", "add tests", ...) e aos nomes dos projetos acima.
# bonus: forca desse reforco (maior do que 0, no maximo 10). Forte demais pode
#   fazer ouvir um comando ou projeto onde ele nao foi dito.
# lexico: aplica as correcoes aprendidas das tuas gravacoes de treino, em
#   models/adaptacao/lexico-en.json (fica fora do Git). Sem esse ficheiro a
#   transcricao continua igual e o log diz porque.
# Fica desligada ate a medicao mostrar que ajuda: .venv\Scripts\python
#   scripts/adaptar_sotaque.py --medir diz que valores por aqui.
[adaptacao]
reforco = false
bonus = 1.5
lexico = false

# Opcional: o modo de conversa, a escuta sem palavra de ativacao depois de o
# jarvis falar. Sem esta tabela valem estes mesmos valores.
# seguimento_s: segundos de silencio que fecham a conversa (entre 3 e 30).
#   Depois de cada resposta do jarvis podes continuar sem dizer "hey jarvis", e
#   a contagem recomeca depois de cada resposta. "that's all" / "thanks, that's
#   it" ("e tudo") tambem fecham. O que disseres e um pedido normal, com as
#   mesmas confirmacoes; silencio, hesitacoes, so "obrigado", uma frase sem
#   pedido ou conversa a volta que nao seja uma pergunta ao jarvis sao
#   ignorados.
# sons: um som curto e suave marca quando essa escuta abre (so a primeira vez,
#   nao depois de cada resposta) e outro, diferente, quando fecha. Poe false
#   para os desligar (a bolinha e a linha de estado continuam a mostrar
#   "A OUVIR-TE").
# volume: volume desses sons (maior do que 0, no maximo 1); baixo por omissao.
# interromper: enquanto o jarvis fala, falar por cima dele pausa-o logo; um
#   "yeah" ou uma tosse deixam-no continuar, uma frase a serio para-o e passa a
#   ser o pedido seguinte. Poe false para desligar (--sem-voz tambem desliga).
[escuta]
seguimento_s = 15.0
sons = true
volume = 0.15
interromper = true

# Opcional: onde o jarvis procura os teus repositorios git para os juntar aos
# projetos acima, sem os escreveres a mao. Em cada arranque, cada pasta filha
# DIRETA destas raizes que tenha .git passa a ser um projeto com o nome da
# pasta. Um projeto de [[projetos]] com o mesmo nome ganha sempre. Pastas sem
# .git, com um nome que nao serve para projeto, ou juncoes/atalhos que apontam
# para fora da raiz ficam de fora (uma linha no log). Uma raiz que nao existe
# nao e erro.
# Sem esta tabela procura em Desktop/Repositorios dentro da tua pasta pessoal.
# pastas: lista de caminhos absolutos ("~" tambem serve); [] desliga a descoberta.
# [descoberta]
# pastas = ["D:/caminho/para/repositorios"]

# Opcional: a memoria. Sem esta tabela valem estes mesmos valores, que tambem
# sao os tetos: aqui so se podem baixar. A conversa em si fica no cerebro, so
# em memoria (ver [cerebro]).
# factos: quantos factos o caderno guarda (1 a 50). O caderno fica em
#   memoria/factos.json, fora do Git, e vai para o cerebro como dados.
# caracteres: tamanho maximo de todos os factos juntos (200 a 4000).
# frases_interprete: quantas frases recentes, e o que o jarvis fez com elas, o
#   interprete local recebe (so no recurso sem cerebro) para perceber "send
#   that to jarvis too" ou "same for crypto-radar" (3 a 5). Nunca escolhem o
#   projeto: esse tem de ser dito.
# expira_min: minutos sem frases ate o interprete esquecer as recentes (1 a 30).
# A chave antiga trocas continua aceite, mas ja nao faz nada.
[memoria]
expira_min = 30
factos = 50
caracteres = 4000
frases_interprete = 5
